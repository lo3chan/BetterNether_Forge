buildscript {
    repositories {
        gradlePluginPortal()
    }
}
sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.terraformersmc.com/releases" }
    maven { url = "https://api.modrinth.com/maven" }
}

neoForge {
    version = project.neoforge_version
    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = "2024.07.28"
    }
    accessTransformers.from(file("src/main/resources/META-INF/accesstransformer.cfg"))
    runs {
        client {
            client()
            systemProperty "forge.logging.markers", "REGISTRIES"
            systemProperty "forge.logging.console.level", "debug"
        }
        server {
            server()
            systemProperty "forge.logging.markers", "REGISTRIES"
            systemProperty "forge.logging.console.level", "debug"
        }
        data {
            data()
            programArguments.addAll "--mod", project.mod_id,
                    "--all",
                    "--output", file("src/main/generated").absolutePath,
                    "--existing", file("src/main/resources").absolutePath
        }
    }
}

sourceSets {
    main {
        java {
            exclude 'reference_1.20.1/**'
        }
        resources {
            srcDir 'src/main/generated'
        }
    }
}

dependencies {
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}:api"
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    it.options.release = 21
}
