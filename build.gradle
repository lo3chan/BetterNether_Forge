buildscript {
    def enablePublishing = project.hasProperty("publishMods") || System.getenv("PUBLISH_MODS") == "true"
    if (enablePublishing) {
        repositories {
            maven { url "https://plugins.gradle.org/m2/" }
        }
        dependencies {
            classpath "com.modrinth.minotaur:Minotaur:2.+"
            classpath "gradle.plugin.com.matthewprenger:CurseGradle:1.4.0"
        }
    }
    project.ext.enablePublishing = enablePublishing
}

plugins {
    id 'java-library'
    id 'idea'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.74'
    id 'maven-publish'
    id "com.diffplug.spotless" version "6.25.0"
}

apply from: 'betternether.gradle'
